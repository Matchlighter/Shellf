name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Syntax and UI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # dash matters: it is what /bin/sh is on Debian, and it is stricter than
      # bash about the things this script relies on.
      - name: Install dash
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dash

      - run: test/run.sh

  image:
    name: Image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Build for this runner first and prove the thing works, before anything
      # is published. The build context is the repo root, because the image
      # carries shlf and mods/ as its payload.
      - name: Build for the runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: shellf:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test what it serves
        run: test/smoke.sh shellf:smoke

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # arm64 as well as amd64: half the point of this project is boxes that
      # are not x86, and the image has no compiled dependencies to slow it down.
      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Release
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Draft the release notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ```sh
            docker run -d -p 8080:8080 \
              -e SHELLF_PUBLIC_URL=https://sh.me.net \
              ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```
